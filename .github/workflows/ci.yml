name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: License check
        run: |
          if [ -f "LICENSE" ]; then
            echo "[OK] LICENSE present"
          else
            echo "[NO] LICENSE missing" && exit 1
          fi

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run test suite (pytest)
        run: |
          # 真实运行 SDK 测试，任何测试失败都会使 job 失败（不使用 || echo 吞掉失败）。
          # 注意：tests/ 下的集成/端到端用例（test_integration_e2e.py 等）需要连接
          # 运行中的 AgentRT Gateway；CI 无网关环境下此类用例应在测试代码内以
          # skip/skipif 标记跳过，而不是在 workflow 中抑制失败。
          python -m pytest tests/ -v
